spring.application.name=springboot-web-jpa

# Embedded in-memory H2 database, recreated on every start
spring.datasource.url=jdbc:h2:mem:employees;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console (JDBC URL above, user sa, no password)
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
