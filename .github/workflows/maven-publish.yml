# Builds, signs and publishes the library to Maven Central when a GitHub release is created.
# The release tag sets the version: v1.2.3 publishes 1.2.3.
#
# Required repository secrets:
#   CENTRAL_USERNAME, CENTRAL_PASSWORD  user token from https://central.sonatype.com (Account > Generate User Token)
#   GPG_PRIVATE_KEY                     output of: gpg --armor --export-secret-keys <KEY_ID>
#   GPG_PASSPHRASE                      passphrase of that key

name: Publish to Maven Central

on:
  release:
    types: [created]

jobs:
  publish:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        # Writes a settings.xml with a "central" server; the values below are environment
        # variable names, read from the publish step's env at deploy time
        server-id: central # Must match publishingServerId in pom.xml
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Set version from release tag
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        VERSION="${TAG#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Release tag '$TAG' is not a version such as v1.2.3 or 1.2.3"
          exit 1
        fi
        mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
        echo "Publishing version $VERSION"

    # Runs the tests, attaches sources and javadoc, signs everything, uploads to the
    # Central Publisher Portal and waits until the release is published
    - name: Publish to Maven Central
      run: mvn -B deploy -P release
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
